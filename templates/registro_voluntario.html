<!DOCTYPE html>
<html>
<head>
	<title>Registro de voluntario(a)</title>
    <link rel="stylesheet" type="text/css" href="../static/css/styles.css">
</head>
<body>
    <div class="main-container">
        <div id="val-box" hidden>
            <h2 id="val-msg"></h2>
            <ul id="val-list"></ul>
        </div>
        {% if error %}
        <p class="error-message" role="alert">{{ error }}</p>
        {% endif %}
        <h1>Registro de voluntario(a)</h1>
        <form name="myForm" action="/registro_voluntario.html" method="post" enctype="multipart/form-data">
            
            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" id="nombre" minlength="4" placeholder="Escribe tu nombre" required><br>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" minlength="6" maxlength="254" placeholder="ejemplo@correo.cl" required><br>

            <label for="phone">Phone</label>
            <input type="tel" name="phone" id="phone" minlength="8" maxlength="15" pattern="[0-9]{8,15}" placeholder="123456789" required><br>
            
            <label for="select-region">Región</label>
            <select name="select-region" id="select-region" required>
                <option value="">Seleccione una región</option>
            </select><br>

            <label for="select-comuna">Comuna</label>
            <select name="select-comuna" id="select-comuna" required>
                <option value="">Seleccione una comuna</option>
            </select><br>

            <button id="submit-btn" type="submit">Registrarse</button>
            
        </form>
    </div>
    <script src="../static/js/select.js"></script>
    <script src="../static/js/validation.js"></script>
</body>
</html>
